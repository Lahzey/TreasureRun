<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Soul Urn: a funerary urn with a soul wisp curling into its mouth. Colours follow the model: glaze #4a5e8c, bronze #c49c48, soul light #8cecde on night blue #161c2e. -->
  <circle cx="32" cy="32" r="30" fill="#161c2e" stroke="#8cecde" stroke-width="3"/>
  <!-- the soul: a wisp with a fading tail, diving into the mouth -->
  <path d="M12 16 Q16 8 24 11 Q31 14 28 20 Q26 24 31 25" fill="none" stroke="#8cecde" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  <path d="M21 10.5 Q30 12 29 19 Q28.5 23 32 24.5" fill="none" stroke="#dffffa" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="20" cy="10.5" r="3.4" fill="#dffffa"/>
  <circle cx="45" cy="15" r="1.4" fill="#8cecde"/>
  <circle cx="50" cy="22" r="1" fill="#8cecde"/>
  <!-- glow in the mouth -->
  <ellipse cx="32" cy="26" rx="7" ry="2.6" fill="#8cecde"/>
  <!-- lip and neck -->
  <path d="M23 27 H41" stroke="#c49c48" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M27 29 H37 V33 H27 Z" fill="#4a5e8c" stroke="#161c2e" stroke-width="1.4"/>
  <!-- belly with a bronze shoulder band and the rune band -->
  <path d="M27 33 Q15 36 16 45 Q17 52 25 53 H39 Q47 52 48 45 Q49 36 37 33 Z" fill="#4a5e8c" stroke="#161c2e" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M20.5 37.5 Q32 34 43.5 37.5" fill="none" stroke="#c49c48" stroke-width="2.4"/>
  <path d="M18.5 44 H22 M25 44 H28.5 M31.5 44 H34.5 M37.5 44 H41 M44 44 H45.5" stroke="#8cecde" stroke-width="2.4" stroke-linecap="round"/>
  <!-- foot -->
  <path d="M26 53 L24.5 56.5 H39.5 L38 53 Z" fill="#c49c48" stroke="#161c2e" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
