<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Wandering Merchant: a market wagon. Colours follow the wagon model: roof #5fae5a, body #d29a5c, awning #f3e3c3/#c8382c. -->
  <circle cx="32" cy="32" r="30" fill="#2b1c10" stroke="#5fae5a" stroke-width="3"/>
  <g transform="translate(0 -6)">
    <!-- roof -->
    <path d="M12 27 Q32 13 52 27 Z" fill="#5fae5a" stroke="#2b1c10" stroke-width="2" stroke-linejoin="round"/>
    <!-- body with the serving window -->
    <rect x="15" y="27" width="34" height="17" fill="#d29a5c" stroke="#2b1c10" stroke-width="2"/>
    <rect x="20" y="31" width="24" height="8" fill="#2b1c10"/>
    <!-- striped awning with a scalloped edge -->
    <path d="M17 29 H47 V33 Q44.5 36 42 33 Q39.5 36 37 33 Q34.5 36 32 33 Q29.5 36 27 33 Q24.5 36 22 33 Q19.5 36 17 33 Z" fill="#f3e3c3" stroke="#2b1c10" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M22 29 V33.5 M32 29 V33.5 M42 29 V33.5" stroke="#c8382c" stroke-width="5"/>
    <!-- wheels, a little below the body -->
    <circle cx="23" cy="50.5" r="4.6" fill="#2b1c10" stroke="#d29a5c" stroke-width="2.2"/>
    <circle cx="41" cy="50.5" r="4.6" fill="#2b1c10" stroke="#d29a5c" stroke-width="2.2"/>
    <circle cx="23" cy="50.5" r="1.5" fill="#5fae5a"/>
    <circle cx="41" cy="50.5" r="1.5" fill="#5fae5a"/>
  </g>
</svg>
