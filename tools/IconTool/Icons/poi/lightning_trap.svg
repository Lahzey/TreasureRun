<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Lightning Trap: a Tesla coil throwing arcs. Three colours only: navy #1d2740, copper #d68b42, electric #8fe6ff. -->
  <circle cx="32" cy="32" r="30" fill="#1d2740" stroke="#d68b42" stroke-width="3"/>
  <!-- arcs -->
  <path d="M21 17 L14 21 L17 24 L9 30" fill="none" stroke="#8fe6ff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M43 17 L50 21 L47 24 L55 30" fill="none" stroke="#8fe6ff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M32 9 L30 5" fill="none" stroke="#8fe6ff" stroke-width="2.6" stroke-linecap="round"/>
  <!-- torus on top -->
  <ellipse cx="32" cy="16" rx="12" ry="5.5" fill="#d68b42" stroke="#1d2740" stroke-width="2"/>
  <ellipse cx="32" cy="15" rx="5" ry="2" fill="#1d2740"/>
  <!-- coil column with windings -->
  <rect x="27" y="20" width="10" height="24" fill="#d68b42" stroke="#1d2740" stroke-width="2"/>
  <path d="M27 25 H37 M27 29 H37 M27 33 H37 M27 37 H37 M27 41 H37" stroke="#1d2740" stroke-width="1.6"/>
  <!-- base -->
  <path d="M21 52 L24 44 H40 L43 52 Z" fill="#d68b42" stroke="#1d2740" stroke-width="2" stroke-linejoin="round"/>
  <path d="M17 55 H47" stroke="#8fe6ff" stroke-width="2.6" stroke-linecap="round"/>
</svg>
